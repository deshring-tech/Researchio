name: CI

# Runs the full verification pipeline on every push and pull request.
# No secrets are required: without GEMINI_API_KEY the app runs with AI disabled,
# and scripts/verify.ts covers everything that does not need a live provider.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # Relative file: paths resolve against prisma/, matching the CLI.
      DATABASE_URL: 'file:./ci.db'
      UPLOAD_DIR: 'storage/uploads'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The end-to-end suite needs the app actually running. Start it in the
      # background, wait for it to answer, then run the assertions against it.
      - name: Start server
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000/login --timeout 60000

      - name: Run end-to-end verification
        run: npm run verify:e2e

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
