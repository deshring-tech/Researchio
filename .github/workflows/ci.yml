name: CI

# Runs the full verification pipeline on every push and pull request.
# No secrets are required: without GEMINI_API_KEY the app runs with AI disabled,
# and scripts/verify.ts covers everything that does not need a live provider.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # Relative file: paths resolve against prisma/, matching the CLI.
      DATABASE_URL: 'file:./ci.db'
      UPLOAD_DIR: 'storage/uploads'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # The end-to-end suite needs the app actually running. Start it in the
      # background, wait for it to answer, then run the assertions against it.
      - name: Start server
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000/login --timeout 60000

      - name: Run end-to-end verification
        run: npm run verify:e2e

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  # Proves the production image builds and that a container actually becomes
  # healthy — a Dockerfile that only compiles is not evidence of a deployable
  # artifact.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t researchio:ci .

      - name: Start container
        run: |
          docker run -d --name researchio-ci -p 3000:3000 \
            -v researchio-ci-data:/data \
            researchio:ci

      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' researchio-ci 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "container healthy after ${attempt} checks"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "container reported unhealthy"
              docker logs researchio-ci
              exit 1
            fi
            sleep 5
          done
          echo "timed out waiting for health"
          docker logs researchio-ci
          exit 1

      - name: Verify the health endpoint reports ok
        run: |
          body=$(curl -fsS http://localhost:3000/api/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Confirm data survives a container replacement
        run: |
          # The volume is the only durable state; recreating the container must
          # not lose the database.
          docker exec researchio-ci sh -c 'ls -l /data/researchio.db'
          docker rm -f researchio-ci
          docker run -d --name researchio-ci2 -p 3001:3000 \
            -v researchio-ci-data:/data researchio:ci
          sleep 20
          docker exec researchio-ci2 sh -c 'ls -l /data/researchio.db'

      - name: Container logs
        if: always()
        run: docker logs researchio-ci2 2>&1 | tail -50 || true
