# Researchio, single-node deployment.
#
# The `researchio-data` volume is the only durable state: it holds the SQLite
# database and every uploaded source document. Everything else is disposable
# and rebuilt from the image.
#
#   docker compose up -d --build
#   docker compose logs -f
#
# Back up with:
#   docker compose exec app sh -c 'tar czf - /data' > researchio-backup.tar.gz

services:
  app:
    build: .
    restart: unless-stopped

    ports:
      - '${PORT:-3000}:3000'

    environment:
      # Required for AI features. Without it the app runs in a labelled
      # degraded mode rather than failing.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # Optional model overrides; the image defaults are known-good.
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}

      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # DATABASE_URL, UPLOAD_DIR and SECURE_COOKIES are set in the Dockerfile
      # and deliberately not overridable here: they must point at the volume.

    volumes:
      - researchio-data:/data

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Gives in-flight requests and any running ingestion time to finish before
    # the container is killed.
    stop_grace_period: 30s

volumes:
  researchio-data:
